name: Build APK

# Dijalankan manual: Actions -> Build APK -> Run workflow.
# Aplikasi memuat web Pelita dari GitHub Pages, jadi APK cukup dibuat sekali.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek folder android-app
        run: test -f android-app/package.json || { echo "android-app belum ada. Unggah pelita-v0.6.0.zip dulu dan tunggu workflow Pelita selesai."; exit 1; }

      - name: Alamat web otomatis (dari nama repositori)
        working-directory: android-app
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          export WEB_URL="https://$OWNER.github.io/$REPO/"
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.server.url=process.env.WEB_URL;
            c.server.allowNavigation=[new URL(process.env.WEB_URL).host];
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2)+"\n");
          '
          cat capacitor.config.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        working-directory: android-app
        run: npm install

      - name: Buat proyek Android
        working-directory: android-app
        run: npx cap add android

      - name: Ikon dan splash
        working-directory: android-app
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1B1405' --iconBackgroundColorDark '#1B1405' \
            --splashBackgroundColor '#0d1f1b' --splashBackgroundColorDark '#0d1f1b'

      - name: Warna bilah status dan izin getar
        working-directory: android-app
        run: |
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:statusBarColor">\#0d1f1b</item>\n        <item name="android:windowBackground">\#0d1f1b</item>#' "$S"
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          cat "$S"

      - name: Nomor versi
        working-directory: android-app
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle

      - name: Kunci penanda tetap
        working-directory: android-app
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Sinkronkan Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan berkas
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk pelita.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Pelita APK #${{ github.run_number }}
          files: pelita.apk
