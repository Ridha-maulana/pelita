name: Pelita

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pelita
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buka zip (bila ada pelita-v*.zip di root)
        run: |
          z=$(ls -1 pelita-v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$z" ]; then
            echo "Membuka $z"
            unzip -o -q "$z" -x '.github/*'
            rm -f pelita-v*.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Buka $z" || true
            git push
          else
            echo "Tidak ada zip, lanjut build."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
