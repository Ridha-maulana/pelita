
name: Pelita

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk:
        description: 'Bangun APK juga (centang bila perlu)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pelita
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buka zip (bila ada pelita-v*.zip di root)
        run: |
          z=$(ls -1 pelita-v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$z" ]; then
            echo "Membuka $z"
            unzip -o -q "$z" -x '.github/*'
            rm -f pelita-v*.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Buka $z" || true
            git push
          else
            echo "Tidak ada zip, lanjut build."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  apk:
    # Hanya saat Run workflow manual dengan kotak "Bangun APK" dicentang.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apk }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek folder android-app
        run: test -f android-app/package.json || { echo "android-app belum ada. Unggah zip Pelita terbaru dulu dan tunggu workflow Pelita selesai."; exit 1; }

      - name: Alamat web otomatis (dari nama repositori)
        working-directory: android-app
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          export WEB_URL="https://$OWNER.github.io/$REPO/"
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.server.url=process.env.WEB_URL;
            c.server.allowNavigation=[new URL(process.env.WEB_URL).host];
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2)+"\n");
          '
          cat capacitor.config.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        working-directory: android-app
        run: npm install

      - name: Buat proyek Android
        working-directory: android-app
        run: npx cap add android

      - name: Ikon dan splash
        working-directory: android-app
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1B1405' --iconBackgroundColorDark '#1B1405' \
            --splashBackgroundColor '#0d1f1b' --splashBackgroundColorDark '#0d1f1b'

      - name: Warna bilah status dan izin getar
        working-directory: android-app
        run: |
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:statusBarColor">\#0d1f1b</item>\n        <item name="android:windowBackground">\#0d1f1b</item>#' "$S"
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          cat "$S"

      - name: Nomor versi
        working-directory: android-app
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle

      - name: Kunci penanda tetap
        working-directory: android-app
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.b64 ]; then
            base64 -d debug.keystore.b64 > ~/.android/debug.keystore
            echo "Kunci penanda tetap dipakai"
          else
            echo "Tidak ada debug.keystore.b64, Gradle membuat kunci baru"
          fi

      - name: Sinkronkan Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan berkas
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk pelita.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Pelita APK #${{ github.run_number }}
          files: pelita.apk
